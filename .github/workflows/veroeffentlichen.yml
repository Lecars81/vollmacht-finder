name: App veröffentlichen

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/veroeffentlichen.yml"]
  workflow_dispatch:
  workflow_call:            # wird nach der nächtlichen Prüfung aufgerufen

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main         # immer den neuesten Stand inkl. Prüfergebnis
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
