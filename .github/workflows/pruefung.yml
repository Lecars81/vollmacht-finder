name: Nächtliche Linkprüfung

on:
  schedule:
    - cron: "30 1 * * *"   # täglich 02:30 Uhr Winterzeit / 03:30 Uhr Sommerzeit
  workflow_dispatch:        # zusätzlich per Knopf „Run workflow“ startbar

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: linkpruefung
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links prüfen, Status speichern, Vorschläge anlegen
        run: python pruefung/lauf_github.py
        env:
          TZ: Europe/Berlin
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTACT: ${{ vars.KONTAKT_MAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

  # Commits der Prüfung starten keinen weiteren Workflow – daher hier direkt veröffentlichen
  veroeffentlichen:
    needs: pruefen
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/veroeffentlichen.yml
